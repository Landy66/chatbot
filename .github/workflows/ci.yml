name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.14.8
        run: uv python install 3.14.8

      - name: Install dependencies from frozen uv.lock
        run: uv sync --frozen --python 3.14.8

      - name: Check code formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run automated test suite with pytest
        run: uv run pytest -v
