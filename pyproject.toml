[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-assistant"
version = "0.1.0"
description = "Allgemeiner deutscher KI-Assistent mit Sitzungsgedächtnis und echtem Streaming"
readme = "README.md"
requires-python = ">=3.14.8, <3.15"
dependencies = [
    "pydantic-ai>=2.55.0",
    "openai>=3.28.0",
    "gradio>=6.30.0",
    "pydantic-settings>=2.15.0",
    "groq>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_assistant"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
